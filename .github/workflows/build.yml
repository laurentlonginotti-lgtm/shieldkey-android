name: Build ShieldKey APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Décode le keystore (secret base64) vers un fichier réel.
      # Cette étape ne fait jamais échouer le job : si problème, on log et
      # le build release est simplement sauté (le debug se fait toujours).
      - name: Decode keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "[DEBUG] Secret KEYSTORE_BASE64 vide ou absent."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr -cd 'A-Za-z0-9+/=')
          printf '%s' "$CLEAN" | base64 -d > "$GITHUB_WORKSPACE/release.jks" 2> base64_err.log
          if [ $? -ne 0 ]; then
            echo "[DEBUG] base64 -d a échoué :"; cat base64_err.log
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/release.jks" 2>/dev/null || echo 0)
          echo "[DEBUG] Keystore décodé : $SIZE octets"
          if [ "$SIZE" -lt 1000 ]; then
            echo "[DEBUG] Taille trop petite, build release sauté."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HEADER=$(xxd -l 4 -p "$GITHUB_WORKSPACE/release.jks")
          if ! echo "$HEADER" | grep -q '^3082'; then
            echo "[DEBUG] En-tête PKCS12/ASN.1 invalide. Build release sauté."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "[DEBUG] Keystore valide, prêt pour signature"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      # Tests JVM (SkCrypto, PasswordStrength, RecoveryCode, AtomicWrite) : rapides, et
      # BLOQUANTS — un test rouge, pas d'APK. C'est le contrat : on ne livre pas ce qui
      # contredit ce qu'on a promis.
      - name: Unit tests (JVM)
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --console=plain 2>&1 | tee test.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "==================== TESTS EN ECHEC (copier ci-dessous) ===================="
          grep -nE "FAILED|^e: |error:" test.log
          echo "==========================================================================="
          exit $STATUS

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-jvm
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "==================== ERREURS KOTLIN (copier ci-dessous) ===================="
          grep -nE "^e: |error:|warning:.*unresolved" build.log
          echo "==========================================================================="
          exit $STATUS

      # Release signée : l'APK sert aux tests directs sur téléphone ; l'AAB (Android App
      # Bundle) est le SEUL format accepté par la Play Console pour une nouvelle app.
      # Les deux sont signés avec le même keystore (CN=ShieldKey).
      - name: Build Release APK + AAB
        if: ${{ steps.decode_keystore.outputs.release_ready == 'true' }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldKey-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShieldKey-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload Release AAB (Play Store)
        if: ${{ hashFiles('app/build/outputs/bundle/release/app-release.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShieldKey-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

  # Tests instrumentés : VaultStore, BackupManager, BackupMeta, VaultRepository — tout ce qui
  # touche au fichier du coffre, avec le VRAI Argon2 natif et le vrai Android. Job séparé :
  # l'émulateur prend ~8 min et ne doit pas retarder l'APK ; mais s'il est rouge, on le voit.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Accélération matérielle : sans KVM l'émulateur met 20 min à démarrer, quand il démarre.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # bash + pipefail : le runner lance le script avec sh, qui n'a pas PIPESTATUS.
          script: bash -o pipefail -c "./gradlew connectedDebugAndroidTest --no-daemon --console=plain 2>&1 | tee emu.log"

      # Le journal brut d'un job n'est lisible qu'avec un jeton GitHub ; les ANNOTATIONS, elles,
      # sont publiques (API check-runs). En cas d'échec, on y publie chaque test rouge avec son
      # message, ou les lignes d'erreur de Gradle si l'échec précède les tests.
      - name: Report failures as annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, re, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)
          total = failed = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              for tc in r.iter("testcase"):
                  for bad in list(tc.iter("failure")) + list(tc.iter("error")):
                      failed += 1
                      text = (bad.get("message") or bad.text or "?").strip()
                      first = text.splitlines()[0][:400] if text else "?"
                      cls = (tc.get("classname") or "?").split(".")[-1]
                      print(f"::error title={cls}.{tc.get('name')}::{first}")
          if files:
              print(f"::notice title=Tests instrumentes::{failed} en echec sur {total}")
          else:
              print("::error title=Aucun rapport XML::l'echec precede les tests (emulateur, installation ou compilation)")
              try:
                  lines = open("emu.log", encoding="utf-8", errors="replace").read().splitlines()
              except OSError:
                  lines = []
              hits = [l for l in lines if re.search(r"FAILED|error:|Exception|INSTALL_FAILED|What went wrong|No connected|Could not", l)]
              for l in (hits or lines[-25:])[-25:]:
                  print(f"::error::{l[:400]}")
          PYEOF

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-emulateur
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
            emu.log
          retention-days: 14
