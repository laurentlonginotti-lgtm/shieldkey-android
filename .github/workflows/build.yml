name: Build ShieldKey APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Décode le keystore (secret base64) vers un fichier réel.
      # Cette étape ne fait jamais échouer le job : si problème, on log et
      # le build release est simplement sauté (le debug se fait toujours).
      - name: Decode keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "[DEBUG] Secret KEYSTORE_BASE64 vide ou absent."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr -cd 'A-Za-z0-9+/=')
          printf '%s' "$CLEAN" | base64 -d > "$GITHUB_WORKSPACE/release.jks" 2> base64_err.log
          if [ $? -ne 0 ]; then
            echo "[DEBUG] base64 -d a échoué :"; cat base64_err.log
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/release.jks" 2>/dev/null || echo 0)
          echo "[DEBUG] Keystore décodé : $SIZE octets"
          if [ "$SIZE" -lt 1000 ]; then
            echo "[DEBUG] Taille trop petite, build release sauté."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HEADER=$(xxd -l 4 -p "$GITHUB_WORKSPACE/release.jks")
          if ! echo "$HEADER" | grep -q '^3082'; then
            echo "[DEBUG] En-tête PKCS12/ASN.1 invalide. Build release sauté."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "[DEBUG] Keystore valide, prêt pour signature"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        if: ${{ steps.decode_keystore.outputs.release_ready == 'true' }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldKey-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShieldKey-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
